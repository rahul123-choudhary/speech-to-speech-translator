# Separate direct Quechua-speech → English-speech experiment.
# Do not fill these manifests from the Spanish-only IWSLT references. Every
# English training record needs aligned English text, licensed English target
# speech, and native/community review before it can be used.
experiment_name: que_eng_direct_s2st_2h
source_language: que
target_language: en
sample_rate: 16000
max_seconds: 15
encoder_model: facebook/wav2vec2-xls-r-300m
codec_bandwidth: 6.0
lora:
  rank: 8
  alpha: 16
  dropout: 0.05
training:
  epochs: 60
  batch_size: 2
  gradient_accumulation: 8
  learning_rate: 0.0001
  early_stopping_patience: 8
  augment_train: true
  seed: 17
data:
  train_manifest: data/manifests_en/train.jsonl
  validation_manifest: data/manifests_en/validation.jsonl
  test_manifest: data/manifests_en/test.jsonl
