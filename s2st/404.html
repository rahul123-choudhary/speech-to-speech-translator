<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Whoops! Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
      background: radial-gradient(circle at 50% 50%, #08080a 0%, #000000 100%);
    }

    /* Ambient celestial starfield canvas */
    #starsCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.85;
    }

    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px 20px;
      max-width: 900px;
      width: 100%;
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* 4 0 4 ROW */
    .error-code-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 3.5vw, 36px);
      user-select: none;
    }

    .digit-four {
      font-size: clamp(84px, 16vw, 156px);
      font-weight: 300;
      line-height: 1;
      color: #ffffff;
      letter-spacing: -2px;
      text-shadow: 0 0 35px rgba(255, 255, 255, 0.25);
    }

    /* ECLIPSE ZERO */
    .eclipse-wrapper {
      position: relative;
      width: clamp(88px, 16.5vw, 164px);
      height: clamp(88px, 16.5vw, 164px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* The glowing photo corona */
    .eclipse-img {
      position: absolute;
      width: clamp(180px, 32vw, 330px);
      height: clamp(180px, 32vw, 330px);
      object-fit: cover;
      pointer-events: none;
      mix-blend-mode: screen;
      filter: contrast(1.15) brightness(1.08);
      animation: subtleCoronaPulse 8s ease-in-out infinite alternate;
    }

    /* Center black moon silhouette */
    .moon-silhouette {
      position: relative;
      z-index: 3;
      width: clamp(68px, 12.8vw, 126px);
      height: clamp(68px, 12.8vw, 126px);
      border-radius: 50%;
      background: #000000;
      box-shadow: 
        0 0 1px 1px rgba(255, 255, 255, 0.9),
        0 0 15px 4px rgba(255, 255, 255, 0.4),
        0 0 35px 12px rgba(255, 255, 255, 0.2);
    }

    /* Headings and Message */
    .whoops-title {
      margin-top: clamp(28px, 4.5vh, 46px);
      font-size: clamp(24px, 3.8vw, 33px);
      font-weight: 500;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .sub-message {
      margin-top: 10px;
      font-size: clamp(14px, 2.2vw, 18px);
      font-weight: 400;
      color: #d1d5db;
      max-width: 480px;
      line-height: 1.5;
    }

    /* Back to Home Button */
    .btn-home {
      margin-top: clamp(34px, 5.5vh, 52px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 28px;
      background: transparent;
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.42);
      border-radius: 4px;
      transition: all 0.22s ease-in-out;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    .btn-home:hover {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }

    .btn-home:active {
      transform: translateY(0);
      background: rgba(255, 255, 255, 0.18);
    }

    /* Subtle creator watermark tag at the bottom */
    .author-tag {
      position: fixed;
      bottom: 18px;
      color: rgba(255, 255, 255, 0.35);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      z-index: 2;
      user-select: none;
      transition: color 0.2s;
    }

    .author-tag:hover {
      color: rgba(255, 255, 255, 0.7);
    }

    @keyframes subtleCoronaPulse {
      0% {
        transform: scale(0.98);
        opacity: 0.95;
      }
      100% {
        transform: scale(1.025);
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .error-code-row {
        gap: 12px;
      }
      .btn-home {
        padding: 11px 24px;
        font-size: 10.5px;
      }
    }
  </style>
</head>
<body>
  <canvas id="starsCanvas" aria-hidden="true"></canvas>

  <main class="container" role="main">
    <div class="error-code-row" aria-label="404 Error">
      <span class="digit-four" aria-hidden="true">4</span>
      <div class="eclipse-wrapper" aria-hidden="true">
        <img class="eclipse-img" src="/assets/solar_eclipse.jpg" alt="Solar Eclipse Corona" loading="eager" />
        <div class="moon-silhouette"></div>
      </div>
      <span class="digit-four" aria-hidden="true">4</span>
    </div>

    <h1 class="whoops-title">Whoops!</h1>
    <p class="sub-message">We couldn't find the site you were looking for.</p>

    <a href="/" class="btn-home" id="btnBackHome">BACK TO HOME</a>
  </main>

  <div class="author-tag">Rahul</div>

  <script>
    // Smart back button: return to previous page if in history, else home
    const btn = document.getElementById('btnBackHome');
    btn.addEventListener('click', (e) => {
      if (window.history.length > 1 && document.referrer) {
        e.preventDefault();
        window.history.back();
      }
    });

    // Subtle celestial stars background animation
    (function initStars() {
      const canvas = document.getElementById('starsCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width, height;
      const stars = [];
      const numStars = 65;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random(),
          y: Math.random(),
          size: Math.random() * 1.4 + 0.3,
          alpha: Math.random() * 0.7 + 0.2,
          speed: Math.random() * 0.008 + 0.004,
          phase: Math.random() * Math.PI * 2
        });
      }

      window.addEventListener('resize', resize, { passive: true });
      resize();

      let animationId;
      function animate(time) {
        ctx.clearRect(0, 0, width, height);
        stars.forEach(s => {
          const brightness = s.alpha * (0.65 + 0.35 * Math.sin(time * s.speed + s.phase));
          ctx.fillStyle = `rgba(255, 255, 255, ${brightness})`;
          ctx.beginPath();
          ctx.arc(s.x * width, s.y * height, s.size, 0, Math.PI * 2);
          ctx.fill();
        });
        animationId = requestAnimationFrame(animate);
      }
      animationId = requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
